name: Build font from SVG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['svg/**', 'components/**', 'tools/**', 'tests/**', 'requirements.txt', '.github/workflows/build-font.yml']
permissions:
  contents: read
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python tools/sync_components.py --check
      - run: python tools/build_normalized_fonts.py --svg-dir svg --output build --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: Sealie-SmallSeal-normalized
          path: |
            build/*.ttf
            build/*.woff
            build/variable.css
            build/variable/*.woff
            build/build-manifest.json
            OFL-1.1.txt
            LICENSE-OFL.txt
