name: Publish Sealie specimen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - characters.html
      - 'site/**'
      - fonts/variable.css
      - 'fonts/variable/*.woff'
      - LICENSE-OFL.txt
      - OFL-1.1.txt
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /index.html
            /characters.html
            /site/
            /fonts/variable.css
            /fonts/variable/
            /LICENSE-OFL.txt
            /OFL-1.1.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build only the website and variable webfonts
        run: python site/build.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
